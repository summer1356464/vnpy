[pytest]
# 测试文件和目录模式
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试报告配置
addopts = -v --tb=short

# 忽略的目录
norecursedirs = .git __pycache__ docs examples

# 测试覆盖率配置(如果使用pytest-cov)
# addopts = -v --tb=short --cov=vnpy --cov-report=html:coverage_report --cov-report=term-missing

# 环境变量配置
# 使用命令行或操作系统环境变量设置
# 例如: pytest -e VNPY_TESTING=True

# 标记配置
markers = 
    unit: 单元测试
    integration: 集成测试
    functional: 功能测试
    slow: 慢测试
    datafeed: 数据源测试
    strategy: 策略测试
    alpha: Alpha策略相关测试
    tx: TX数据源相关测试
    cache: 缓存相关测试
